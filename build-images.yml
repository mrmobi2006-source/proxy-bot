name: Build and push server images

# يعمل تلقائيًا في كل مرة ترفع فيها تعديلات إلى main
on:
  push:
    branches: [main]

jobs:
  build-xray:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./docker/xray
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/xray-server:latest

  build-ssh:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./docker/ssh
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ssh-server:latest

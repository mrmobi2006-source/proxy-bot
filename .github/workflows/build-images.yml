name: Build and push server images

on:
  push:
    branches: [main]

jobs:
  build-xray-shared:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./docker/xray-shared
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/xray-shared-server:latest

  build-ssh-shared:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ./docker/ssh-shared
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/ssh-shared-server:latest

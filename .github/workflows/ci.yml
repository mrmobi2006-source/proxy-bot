name: CI

on:
  push:
    branches: [ main, improvements/fixes ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies
        run: |
          cd bot
          npm ci
      - name: Run ESLint
        run: |
          cd bot
          npm run lint
